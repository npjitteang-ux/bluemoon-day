function readStoredSession(){
  const raw=localStorage.getItem("bm_session")||sessionStorage.getItem("bm_session");
  if(!raw)return null;
  try{
    const x=JSON.parse(raw);
    // Migrate an older session that lived only in sessionStorage so closing/swiping
    // the PWA does not unexpectedly sign the user out.
    if(!localStorage.getItem("bm_session")&&x?.refresh_token) localStorage.setItem("bm_session",raw);
    return x;
  }catch{return null}
}

  const raw=JSON.stringify(sess);

  sessionStorage.removeItem("bm_session");

async function api(path,opts={}){opts.headers=Object.assign({"apikey":KEY,"Content-Type":"application/json","Accept":"application/json"},opts.headers||{});if(!opts.headers.Authorization&&S.user?.access_token)opts.headers.Authorization="Bearer "+S.user.access_token;const r=await fetch(URL_+path,opts);let data=null;try{data=await r.json()}catch{}if(!r.ok){let msg=data?.msg||data?.message||data?.error_description||data?.error||`HTTP ${r.status}`;throw new Error(msg)}return data}

async function fetchWithTimeout(url,opts={},ms=8000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),ms);
 try{
   const r=await fetch(url,Object.assign({},opts,{signal:controller.signal}));
   return r;
 }finally{clearTimeout(timer)}
}
async function authUser(token){
 const r=await fetchWithTimeout(URL_+"/auth/v1/user",{headers:{apikey:KEY,Authorization:"Bearer "+token}});
 if(!r.ok) throw new Error("Supabase Auth HTTP "+r.status);
 return r.json();

let refreshPromise=null;
async function refreshSession(){
  const current=ST||readStoredSession();
  if(!current?.refresh_token)throw new Error("ไม่มี refresh token");
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async()=>{
    const r=await fetchWithTimeout(URL_+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:current.refresh_token})},8000);

    if(!r.ok||!d?.access_token)throw new Error(d?.error_description||d?.msg||"ไม่สามารถต่ออายุเซสชันได้");

    saveSession(next);

    // Re-fetch the authenticated user so boot never loses user.id after a restart.
    const u=await authUser(d.access_token);
    S.user={...u,access_token:d.access_token};
    return S.user;
  })().finally(()=>{refreshPromise=null});
  return refreshPromise;
}
async function api(path,opts={},retried=false){

 if(!headers.Authorization&&S.user?.access_token)headers.Authorization="Bearer "+S.user.access_token;

   await refreshSession();
   return api(path,opts,true);
 }
 if(!r.ok) throw new Error(data?.message||data?.msg||data?.error_description||data?.error||("HTTP "+r.status));

}

  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("เชื่อมต่อ Supabase ใช้เวลานานเกินไป")),ms))

const PUSH_VAPID_PUBLIC_KEY="BMcd0PJlvEVz3tdTD7qRIQwlCiV1SSsHSE2Vl2WYeqbzYFzut0eYNHwz1oMlGrJV7U_W6kiW0EHzWO8JhvSeXk8"; const EDGE_PUSH_URL=URL_+"/functions/v1/send-push";

async function registerPushSubscription(){
 if(!S.user||!S.couple||!("serviceWorker"in navigator)||!("PushManager"in window))throw new Error("อุปกรณ์นี้ยังไม่รองรับ Web Push");

   const p256dh=j.keys?.p256dh;

function renderLogin(){el("root").innerHTML=`<div class="app"><div class="login"><div class="card"><div style="font-size:52px;text-align:center">🌙</div><h1 style="text-align:center">BlueMoon Days</h1><p class="muted" style="text-align:center">พื้นที่เล็ก ๆ สำหรับเรื่องที่ไม่อยากลืม</p><div class="notice success" style="text-align:center">“วันธรรมดาก็พิเศษได้ ถ้าได้อยู่ด้วยกัน 🤍”</div><div class="form" style="margin-top:12px"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:2px 4px"><input id="rememberMe" type="checkbox" checked style="width:17px;height:17px"> จดจำการเข้าสู่ระบบ</label><button class="btn" onclick="signIn()">เข้าสู่ระบบ</button><button class="btn ghost" onclick="signUp()">สร้างบัญชี</button></div></div></div></div>`}
async function signIn(){
  try{
    const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:el("email").value.trim(),password:el("pw").value})});
    saveSession({access_token:d.access_token,refresh_token:d.refresh_token});
    const u=await authUser(d.access_token);
    S.user={...u,access_token:d.access_token};
    try{await load();}catch(e){
      console.warn("Post-login data load failed",e);
      S.couple=null;
      render();
      setTimeout(()=>toast("เข้าสู่ระบบแล้ว แต่โหลดข้อมูลคู่รักไม่สำเร็จ ลองรีเฟรชอีกครั้งนะ",true),100);
      return;
    }
    renderSetupIfNeeded();
    startRealtime();
  }catch(e){toast(e.message,true)}
}
async function signUp(){try{const d=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:el("email").value.trim(),password:el("pw").value})});if(d.access_token){saveSession({access_token:d.access_token,refresh_token:d.refresh_token});S.user={...d.user,access_token:d.access_token};await load();renderSetupIfNeeded();startRealtime()}else toast("สมัครสำเร็จ — เช็กอีเมลเพื่อยืนยัน แล้วเข้าสู่ระบบอีกครั้ง")}catch(e){toast(e.message,true)}}
async function load(forcedCid=null){
 const uid=S.user.id;
 try{S.profile=(await api("/rest/v1/users?id=eq."+encodeURIComponent(uid)+"&select=*&limit=1"))[0]||null}catch{}
 const ms=await api("/rest/v1/couple_members?user_id=eq."+encodeURIComponent(uid)+"&select=couple_id,role");
 if(!ms.length){S.couple=null;S.partner=null;return}
 // When joining another couple, always load the newly joined room instead of the first membership.
 const savedCid=getActiveCoupleId();
 const cid=forcedCid || (S.couple?.id && ms.some(x=>x.couple_id===S.couple.id) ? S.couple.id : (savedCid && ms.some(x=>x.couple_id===savedCid) ? savedCid : ms[0].couple_id));
 saveActiveCouple(cid);
 S.couple=(await api("/rest/v1/couples?id=eq."+cid+"&select=*&limit=1"))[0]||null;
 S.members=await api("/rest/v1/couple_members?couple_id=eq."+cid+"&select=user_id,role");
 const other=S.members.find(x=>x.user_id!==uid);
 S.partner=null;
 if(other){
   try{S.partner=(await api("/rest/v1/users?id=eq."+other.user_id+"&select=*&limit=1"))[0]||null}catch{}
 }
 const results=await Promise.allSettled([
   api("/rest/v1/reminders?couple_id=eq."+cid+"&select=*&order=reminder_date.asc.nullslast,reminder_time.asc.nullslast,created_at.asc.nullslast,id.asc"),
   api("/rest/v1/important_days?couple_id=eq."+cid+"&select=*&order=event_date.asc"),
   api("/rest/v1/memories?couple_id=eq."+cid+"&select=*&order=memory_date.desc"),
   api("/rest/v1/pets?couple_id=eq."+cid+"&is_active=eq.true&select=*&order=created_at.asc,id.asc"),
   api("/rest/v1/messages?couple_id=eq."+cid+"&select=*&order=created_at.asc"),
   api("/rest/v1/exercise_logs?couple_id=eq."+cid+"&select=*&order=exercise_date.desc")
 ]);
 S.reminders=results[0].status==="fulfilled"?results[0].value:[];
 S.days=results[1].status==="fulfilled"?results[1].value:[];
 S.memories=results[2].status==="fulfilled"?results[2].value:[];
 S.memoryPhotos={};
 try{
   const photos=await api("/rest/v1/memory_photos?select=memory_id,image_url,sort_order&order=sort_order.asc");
   photos.forEach(p=>{(S.memoryPhotos[p.memory_id]??=[]).push(p.image_url)});
 }catch{}

 S.pets=results[3].status==="fulfilled"?results[3].value:[];
 S.pets.sort((a,b)=>{const ca=String(a.created_at||""),cb=String(b.created_at||"");const c=ca.localeCompare(cb);return c||String(a.id||"").localeCompare(String(b.id||""));});
 S.pets.forEach(p=>{if(!p.photo_url){const u=localStorage.getItem("bm_pet_photo_"+p.id);if(u)p.photo_url=u;}});
 await repairPetPhotoUrls();
 S.petServices={};
 S.petUsage={};
 if(S.pets.length){
   try{
     const ids=S.pets.map(p=>p.id).join(",");
     const svs=await api("/rest/v1/pet_services?pet_id=in.("+ids+")&select=*&order=end_date.asc");
     (svs||[]).forEach(sv=>{(S.petServices[sv.pet_id]??=[]).push(sv)});
     const serviceIds=(svs||[]).map(x=>x.id);
     if(serviceIds.length){
       const logs=await api("/rest/v1/pet_service_usage?pet_service_id=in.("+serviceIds.join(",")+")&select=*&order=use_date.asc");
       (logs||[]).forEach(x=>{(S.petUsage[x.pet_service_id]??=[]).push(x)});
     }
   }catch(e){}
 }
 S.messages=results[4].status==="fulfilled"?results[4].value:[];
 S.exerciseLogs=results[5]?.status==="fulfilled"?results[5].value:[];
 S.exerciseEnabled=Boolean(S.couple?.show_exercise);
 try{S.cycleData=await api("/rest/v1/menstrual_cycles?couple_id=eq."+cid+"&select=*&order=updated_at.desc");}catch(e){S.cycleData=[];} 
 try{S.cyclePeriods=await api("/rest/v1/menstrual_periods?couple_id=eq."+cid+"&select=*&order=start_date.desc,created_at.desc");}catch(e){S.cyclePeriods=[];} 
}

function isoToday(){const n=new Date();return n.toISOString().slice(0,10)}
function exercisePersonName(uid){if(uid===S.user?.id)return S.profile?.name||S.profile?.display_name||S.profile?.full_name||S.user?.user_metadata?.name||S.user?.email?.split("@")[0]||"ฉัน";return S.partner?.name||S.partner?.display_name||S.partner?.full_name||S.partner?.username||S.partner?.email?.split("@")[0]||"คนรัก"}
function exercisePeople(){const a=[{id:S.user?.id,name:exercisePersonName(S.user?.id)}];if(S.partner?.id&&S.partner.id!==S.user?.id)a.push({id:S.partner.id,name:exercisePersonName(S.partner.id)});return a}
function exerciseLogsFor(uid){return (S.exerciseLogs||[]).filter(x=>x.created_by===uid)}
function exerciseDoneOn(date,uid){return exerciseLogsFor(uid).some(x=>normalizeStoredDate(x.exercise_date)===date&&x.did_exercise)}
function exerciseStreak(uid){let n=new Date(),count=0;while(true){const d=n.toISOString().slice(0,10);if(exerciseDoneOn(d,uid)){count++;n.setDate(n.getDate()-1)}else break;}return count}
function exerciseTotal(uid){return exerciseLogsFor(uid).filter(x=>x.did_exercise).length}
function latestWeight(uid){const a=exerciseLogsFor(uid).filter(x=>x.weight_kg!=null&&x.weight_kg!=="").sort((a,b)=>String(b.exercise_date).localeCompare(String(a.exercise_date)));return a[0]?.weight_kg??null}
function weightText(x){return x==null||x===""?"":` · ⚖️ ${Number(x).toFixed(1)} kg`}
function exerciseHome(){const people=exercisePeople();return `<div class="section"><div class="head"><h3>🏃 ออกกำลังกาย</h3><span class="link" onclick="openExerciseHistory()">ประวัติ</span></div>${people.map(person=>{const done=exerciseDoneOn(isoToday(),person.id),streak=exerciseStreak(person.id),total=exerciseTotal(person.id);return `<div class="card" style="margin-bottom:8px"><div class="row"><div style="display:flex;align-items:center;gap:10px"><div class="exercise-orb">${done?'💪':'🏃'}</div><div><b>${esc(person.name)}</b><div class="exercise-streak">วันนี้ ${done?'ทำแล้ว':'ยังไม่ได้ทำ'} · รวม ${total} วัน · ต่อเนื่อง ${streak} วัน</div>${latestWeight(person.id)!=null?`<div class="tiny muted">น้ำหนักล่าสุด ${Number(latestWeight(person.id)).toFixed(1)} kg</div>`:''}</div></div><div style="display:flex;gap:6px"><button class="pill" onclick="setExerciseFor('${person.id}',true)">${done?'✓ ทำแล้ว':'ทำ'}</button><button class="pill" onclick="setExerciseFor('${person.id}',false)">${done?'ไม่ทำ':'ไม่ได้ทำ'}</button></div></div></div>`}).join('')}</div>`}
function exerciseHistoryList(uid){return exerciseLogsFor(uid).slice().sort((a,b)=>String(b.exercise_date).localeCompare(String(a.exercise_date))).map(x=>`<div class="card row"><div><b>${displayThaiDate(x.exercise_date)}</b><div class="tiny muted">${x.did_exercise?'🏃 ทำแล้ว':'— ไม่ได้ทำ'}${weightText(x.weight_kg)}${x.note?' · '+esc(x.note):''}</div></div><button class="pill" onclick="toggleExerciseDate('${x.id}')">${x.did_exercise?'ไม่ทำ':'ทำ'}</button></div>`).join('')}

window.toggleExerciseMode=async()=>{try{const next=!Boolean(S.couple?.show_exercise);const d=await api('/rest/v1/couples?id=eq.'+S.couple.id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({show_exercise:next})});S.couple=d[0];S.exerciseEnabled=next;render();toast(next?'เปิดโหมดออกกำลังกายแล้ว 🏃':'ปิดโหมดออกกำลังกายแล้ว')}catch(e){toast(e.message,true)}};

function icon(c){return({birthday:"🎂",couple:"🤍",pet:"🐾",appointment:"📅",shopping:"🛒",health:"💊"}[c]||"🔔")}
function normalizeStoredDate(s){
 if(!s)return null;
 const p=String(s).slice(0,10).split("-");
 if(p.length!==3)return String(s).slice(0,10);
 let y=Number(p[0]); if(y>2400)y-=543;
 return [String(y).padStart(4,"0"),p[1],p[2]].join("-");
}
function displayThaiDate(s){
 const g=normalizeStoredDate(s);if(!g)return "";
 const p=g.split("-");return `${p[2]}-${p[1]}-${Number(p[0])+543}`;
}
function reminderDisplayDate(r){
 const own=displayThaiDate(r?.reminder_date);
 if(own)return own;
 if(r?.created_at){const d=new Date(r.created_at);if(!Number.isNaN(d.getTime())){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const m={};p.forEach(x=>m[x.type]=x.value);return `${m.day}-${m.month}-${Number(m.year)+543}`;}}
 return '';
}
function inputToStoredDate(s){
 if(!s)return null;
 const p=String(s).split("-");
 if(p.length!==3)return s;
 let y=Number(p[0]);if(y>2400)y-=543;
 return [String(y).padStart(4,"0"),p[1],p[2]].join("-");
}


function calcPetAge(birth){
 const g=normalizeStoredDate(birth); if(!g)return "";
 const b=new Date(g+"T00:00:00"), n=new Date();
 let y=n.getFullYear()-b.getFullYear(), m=n.getMonth()-b.getMonth(), d=n.getDate()-b.getDate();
 if(d<0){m--; const last=new Date(n.getFullYear(),n.getMonth(),0); d+=last.getDate();}
 if(m<0){y--;m+=12;}
 if(y>0)return `${y} ปี ${m} เดือน`;
 if(m>0)return `${m} เดือน ${Math.max(0,d)} วัน`;
 return `${Math.max(0,d)} วัน`;
}
function serviceUsed(sv){
 if(!sv)return 0;
 const logged=(S.petUsage&&S.petUsage[sv.id])||[];
 return logged.length || Number(sv.used_days||0);
}
function serviceRemaining(sv){
 if(!sv)return 0;
 const total=Number(sv.total_days||0),used=serviceUsed(sv);
 return Math.max(0,total-used);
}

function duration(s){const g=normalizeStoredDate(s),a=new Date(g+"T00:00:00"),b=new Date();let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;const prev=new Date(b.getFullYear(),b.getMonth(),0);d+=prev.getDate()}if(m<0){y--;m+=12}return `อยู่ด้วยกันมาแล้ว ${y} ปี ${m} เดือน ${d} วัน 🤍`}
function nextAnniversary(s){const g=normalizeStoredDate(s),a=new Date(g+"T00:00:00"),n=new Date();let d=new Date(n.getFullYear(),a.getMonth(),a.getDate());if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d.setFullYear(d.getFullYear()+1);const days=Math.ceil((d-n)/86400000);return days===0?"วันนี้":`อีก ${days} วัน`}

function reminderSortKey(r){const d=normalizeStoredDate(r?.reminder_date)||"9999-99-99";const t=String(r?.reminder_time||"23:59").slice(0,5);const c=String(r?.created_at||"");return {d,t,c,id:String(r?.id||"")}}function reminders(){const all=[...(S.reminders||[])].sort((a,b)=>{const A=reminderSortKey(a),B=reminderSortKey(b);return B.d.localeCompare(A.d)||B.t.localeCompare(A.t)||B.c.localeCompare(A.c)||B.id.localeCompare(A.id)});const active=all.filter(r=>r.is_active&&!r.is_completed).sort((a,b)=>{const A=reminderSortKey(a),B=reminderSortKey(b);return A.d.localeCompare(B.d)||A.t.localeCompare(B.t)||A.c.localeCompare(B.c)||A.id.localeCompare(B.id)});const history=all.filter(r=>r.is_completed||!r.is_active);const list=S.reminderView==="history"?history:active;return `<section class="page active"><div class="pagehead"><button class="back" onclick="go('home')">←</button><h2>Reminders</h2></div><div class="section"><div style="display:flex;gap:7px;margin-bottom:10px"><button class="pill" style="flex:1" onclick="setReminderView('active')">⏰ กำลังใช้งาน ${active.length}</button><button class="pill" style="flex:1" onclick="setReminderView('history')">📋 ประวัติ ${all.length}</button></div><div class="list">${list.length?list.map(r=>`<div class="card"><div class="row"><div class="rem"><div class="ri">${icon(r.category)}</div><div><b>${esc(r.title)}</b><p class="tiny muted">${reminderDisplayDate(r)}${r.reminder_time?" · "+esc(r.reminder_time.slice(0,5)):""} · ${esc(reminderStatus(r))}</p><p class="tiny muted">${r.repeat_type&&r.repeat_type!=="none"?"🔁 "+esc({daily:"ทุกวัน",weekly:"ทุกสัปดาห์",monthly:"ทุกเดือน",yearly:"ทุกปี"}[r.repeat_type]||r.repeat_type)+" · ":""}ตั้งโดย ${esc(reminderPersonName(r.created_by))}</p></div></div>${r.is_active&&!r.is_completed?`<button class="pill" onclick="completeReminder('${r.id}')">✓</button>`:""}</div>${r.is_active&&!r.is_completed?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="pill" onclick="openReminderEd window.petImgFallback=async function(img){
  try{
    const src=img.dataset.petSrc||img.src||"";
    const marker="/storage/v1/object/public/"+BUCKET+"/";
    const i=src.indexOf(marker);
    if(i<0||!S.user?.access_token)return;
    const path=src.slice(i+marker.length);
    const r=await fetch(URL_+"/storage/v1/object/"+BUCKET+"/"+path,{headers:{apikey:KEY,Authorization:"Bearer "+S.user.access_token}});
    if(!r.ok)return;
    const blob=await r.blob();
    img.src=URL.createObjectURL(blob);
  }catch{}
};
async function repairPetPhotoUrls(){
  if(!S.user||!S.pets?.length)return;
  try{
    const r=await fetch(URL_+"/storage/v1/object/list/"+BUCKET,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+S.user.access_token,"Content-Type":"application/json"},body:JSON.stringify({prefix:S.user.id+"/",limit:1000,offset:0,sortBy:{column:"name",order:"asc"}})});
    if(!r.ok)return;
    const objs=await r.json();
    for(const p of S.pets){
      if(p.photo_url)continue;
      const hit=(objs||[]).find(o=>String(o.name||"").startsWith("pet-"+p.id+"-"));
      if(!hit)continue;
      const url=URL_+"/storage/v1/object/public/"+BUCKET+"/"+S.user.id+"/"+hit.name;
      try{await api("/rest/v1/pets?id=eq."+p.id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({photo_url:url})}); p.photo_url=url;}catch{}
    }
  }catch{}
}

function cycleName(uid){if(uid===S.user?.id)return S.profile?.name||S.profile?.display_name||S.profile?.full_name||S.user?.user_metadata?.name||S.user?.email?.split('@')[0]||'ฉัน';if(uid===S.partner?.id)return S.partner?.name||S.partner?.display_name||S.partner?.full_name||S.partner?.username||S.partner?.email?.split('@')[0]||'แฟน';return 'สมาชิก'}
function cycleAvatar(uid){const p=uid===S.user?.id?S.profile:S.partner;return p?.avatar_url?`style="background-image:url('${esc(p.avatar_url)}')"`:''}
function cycleFor(uid){return (S.cycleData||[]).find(x=>x.user_id===uid&&x.is_active!==false)||null}
function periodsFor(uid){return (S.cyclePeriods||[]).filter(x=>x.user_id===uid).sort((a,b)=>String(b.start_date||'').localeCompare(String(a.start_date||'')))}
function latestPeriod(uid){return periodsFor(uid)[0]||null}
const pad=n=>String(n).padStart(2,'0');
function addDaysISO(date,days){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+Number(days));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function cyclePrediction(c, latest){const start=normalizeStoredDate(latest?.start_date||c?.last_period_start);if(!start)return null;const len=Math.max(21,Math.min(45,Number(c?.cycle_length)||28)),periodLen=Math.max(2,Math.min(10,Number(c?.period_length)||5)),today=isoToday();let next=addDaysISO(start,len),guard=0;while(next<=today&&guard<120){next=addDaysISO(next,len);guard++;}const ov=addDaysISO(next,-14);return {start,next,end:addDaysISO(next,periodLen-1),ov,fertileStart:addDaysISO(ov,-5),fertileEnd:addDaysISO(ov,1),len,periodLen}}
function currentPeriodInfo(uid){const p=latestPeriod(uid);if(!p)return null;const today=isoToday(),start=normalizeStoredDate(p.start_date),end=p.end_date?normalizeStoredDate(p.end_date):null;if(end&&today>end)return {period:p,current:false};if(today<start)return {period:p,current:false};return {period:p,current:!end||today<=end,days:diffDays(start,today)+1}}
function cycleStatus(uid){const c=cycleFor(uid),latest=latestPeriod(uid),cur=currentPeriodInfo(uid);if(cur?.current){return cur.days===1?'มาวันนี้ 🩸':`กำลังมา · วันที่ ${cur.days} 🩸`}const p=cyclePrediction(c,latest);if(!p)return 'ยังไม่ได้ตั้งค่า';const days=diffDays(isoToday(),p.next);if(days===0)return 'คาดว่าวันนี้';if(days>0)return `อีก ${days} วัน`;return `ผ่านมาแล้ว ${Math.abs(days)} วัน`}
function cycleMini(uid){const c=cycleFor(uid),latest=latestPeriod(uid),cur=currentPeriodInfo(uid),p=cyclePrediction(c,latest);return `<div class="cycle-mini"><div class="cycle-user-head"><div class="cycle-avatar" ${cycleAvatar(uid)}>${cycleAvatar(uid)?'':'🌸'}</div><div><div class="cycle-name">${esc(cycleName(uid))}</div><div class="tiny muted">รอบเฉลี่ย ${c?Number(c.cycle_length):28} วัน</div></div></div>${cur?.current?`<div class="cycle-date">วันที่ ${cur.days}</div><div class="cycle-count">🩸 กำลังมีประจำเดือน${latest.end_date?` · หมด ${displayThaiDate(latest.end_date)}`:' · ยังไม่กดหมดวันนี้'}</div>`:p?`<div class="cycle-date">${displayThaiDate(p.next)}</div><div class="cycle-count">${esc(cycleStatus(uid))} · ประจำเดือนคาดการณ์</div>`:`<div class="cycle-date" style="color:#7c8ba0">ยังไม่มีข้อมูล</div><div class="cycle-count">กดตั้งค่ารอบเดือนของคนนี้</div>`}</div>`}
function cycleHomeCard(){const people=[S.user?.id,S.partner?.id].filter(Boolean),has=people.some(uid=>cycleFor(uid)||latestPeriod(uid));return `<div class="section"><div class="head"><h3>🌸 ประจำเดือนของเรา</h3><span class="link" onclick="go('cycles')">ดูทั้งหมด</span></div><div class="card cycle-home"><div class="cycle-pair">${people.map(cycleMini).join('')}</div><div class="cycle-note" style="margin-top:10px">บันทึกรอบจริงย้อนหลังได้ และกด “มาวันนี้” / “หมดวันนี้” ได้ · ${has?'ข้อมูลของแต่ละคนแยกกัน':'ยังไม่ได้ตั้งค่าของทั้งคู่'}</div></div></div>`}
function cycleMonthGrid(p){if(!p)return '';const days=[];for(let i=-2;i<42;i++){const d=addDaysISO(p.next,i),inPeriod=d>=p.next&&d<=p.end,inFertile=d>=p.fertileStart&&d<=p.fertileEnd;days.push(`<span class="${inPeriod?'period ':''}${inFertile?'fertile ':''}${d===isoToday()?'today':''}">${Number(d.slice(8))}</span>`)}return days.join('')}
function periodStatusText(x){if(x.end_date)return `${displayThaiDate(x.start_date)} – ${displayThaiDate(x.end_date)}`;return `${displayThaiDate(x.start_date)} – ยังไม่ระบุวันหมด`}
function openCycleEdit(uid){const c=cycleFor(uid),name=cycleName(uid);if(uid!==S.user?.id){const list=periodsFor(uid);openModal(`🌸 ข้อมูลรอบเดือน · ${esc(name)}`,`<div class="form"><div class="notice">ข้อมูลนี้เป็นของ ${esc(name)} และดูได้จากบัญชีสมาชิกใน Couple เดียวกัน</div>${c?`<div class="card small"><b>รอบเฉลี่ย ${c.cycle_length} วัน</b><p>ประจำเดือนมักมี ${c.period_length} วัน</p></div>`:''}${list.length?`<div class="card small"><b>ประวัติรอบจริง</b>${list.slice(0,6).map(x=>`<p style="margin:7px 0">🩸 ${periodStatusText(x)}</p>`).join('')}`:`<div class="empty"><b>ยังไม่มีประวัติรอบจริง</b><br>ให้ ${esc(name)} เข้าบัญชีของตัวเองเพื่อบันทึก</div>`}<button class="btn ghost" onclick="closeModal()">ปิด</button></div>`);return}openCycleSettings(uid)}
function openCycleSettings(uid){const c=cycleFor(uid),name=cycleName(uid),latest=latestPeriod(uid),list=periodsFor(uid),cur=currentPeriodInfo(uid);openModal(`🌸 ประจำเดือน · ${esc(name)}`,`<div class="form"><div class="notice">บันทึกย้อนหลังได้ และระบบจะใช้รอบจริงในการคาดการณ์รอบถัดไป</div><div class="grid"><button class="btn" onclick="quickPeriodStart('${uid}','today')">🩸 มาวันนี้</button><button class="btn ghost" onclick="quickPeriodEnd('${uid}')">✅ หมดวันนี้</button></div><div class="card small"><b>บันทึกรอบย้อนหลัง / แก้รอบล่าสุด</b><div class="form" style="margin-top:10px"><div class="field"><label>วันเริ่มรอบ</label><input id="perStart" type="date" value="${latest?normalizeStoredDate(latest.start_date):''}"></div><div class="field"><label>วันหมดรอบ (ปล่อยว่างได้)</label><input id="perEnd" type="date" value="${latest?.end_date?normalizeStoredDate(latest.end_date):''}"></div><button class="btn" onclick="savePeriod('${uid}')">บันทึกรอบจริง</button></div></div><div class="card small"><b>รอบเฉลี่ย</b><div class="field" style="margin-top:9px"><label>ความยาวรอบเฉลี่ย (วัน)</label><input id="cyLen" type="number" min="21" max="45" value="${c?.cycle_length||28}"></div><div class="field"><label>ประจำเดือนมักมีกี่วัน</label><input id="cyPeriodLen" type="number" min="2" max="10" value="${c?.period_length||5}"></div><button class="btn ghost" onclick="saveCycleSettings('${uid}')">บันทึกค่ารอบเฉลี่ย</button></div>${cur?.current?`<div class="notice success">🩸 ตอนนี้กำลังมีประจำเดือน · วันที่ ${cur.days}${latest.end_date?` · หมดวันที่ ${displayThaiDate(latest.end_date)}`:' · ยังไม่ระบุวันหมด'}</div>`:''}${list.length?`<div class="card small"><b>ประวัติรอบจริง</b>${list.slice(0,10).map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>🩸 ${periodStatusText(x)}</b></div><button class="pill" onclick="editPeriod('${x.id}')">✏️</button></div>`).join('')}</div>`:'<div class="empty"><b>ยังไม่มีประวัติรอบจริง</b><br>กด “มาวันนี้” หรือบันทึกรอบย้อนหลัง</div>'}<button class="btn ghost" onclick="closeModal()">ปิด</button></div>`)}
window.quickPeriodStart=async uid=>{if(uid!==S.user?.id)return toast('ให้เจ้าของบัญชีคนนั้นเป็นคนบันทึกข้อมูลของตัวเองนะ 🌸',true);await savePeriodData({start_date:isoToday(),end_date:null})}
window.quickPeriodEnd=async uid=>{if(uid!==S.user?.id)return toast('ให้เจ้าของบัญชีคนนั้นเป็นคนจัดการข้อมูลของตัวเองนะ 🌸',true);const cur=currentPeriodInfo(uid);if(!cur?.period)return toast('ยังไม่มีรอบที่กำลังมาอยู่',true);const end=isoToday();if(diffDays(normalizeStoredDate(cur.period.start_date),end)<0)return toast('วันหมดต้องไม่มาก่อนวันเริ่ม',true);try{const d=await api('/rest/v1/menstrual_periods?id=eq.'+encodeURIComponent(cur.period.id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({end_date:end,updated_at:new Date().toISOString()})});const row=d?.[0];if(row){S.cyclePeriods=(S.cyclePeriods||[]).filter(x=>x.id!==row.id);S.cyclePeriods.push(row);S.cyclePeriods.sort((a,b)=>String(b.start_date||'').localeCompare(String(a.start_date||'')))}closeModal();render();toast('บันทึกวันหมดแล้ว ✅')}catch(e){toast('บันทึกวันหมดไม่ได้: '+e.message,true)}};
async function savePeriodData(data){try{if(!S.couple?.id||!S.user?.id)throw new Error('ยังไม่ได้เชื่อมต่อพื้นที่คู่รัก');if(data.start_date>isoToday())throw new Error('วันเริ่มต้องไม่เป็นอนาคต');if(data.end_date&&data.end_date<data.start_date)throw new Error('วันหมดต้องไม่มาก่อนวันเริ่ม');const body={user_id:S.user.id,couple_id:S.couple.id,start_date:data.start_date,end_date:data.end_date||null};const d=await api('/rest/v1/menstrual_periods',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});const row=d?.[0]||body;S.cyclePeriods=(S.cyclePeriods||[]).filter(x=>!(x.user_id===row.user_id&&x.start_date===row.start_date));S.cyclePeriods.push(row);S.cyclePeriods.sort((a,b)=>String(b.start_date||'').localeCompare(String(a.start_date||'')));await saveCycleSettingsData(data.start_date);closeModal();render();toast('บันทึกรอบจริงแล้ว 🌸')}catch(e){toast('บันทึกไม่ได้: '+e.message,true)}}
window.savePeriod=async uid=>{if(uid!==S.user?.id)return toast('ให้เจ้าของบัญชีคนนั้นเป็นคนบันทึกข้อมูลของตัวเองนะ 🌸',true);const start=el('perStart')?.value,end=el('perEnd')?.value||null;if(!start)return toast('เลือกวันเริ่มรอบก่อนนะ',true);await savePeriodData({start_date:start,end_date:end})}
window.editPeriod=async id=>{const x=(S.cyclePeriods||[]).find(y=>y.id===id);if(!x)return;openModal('✏️ แก้ไขรอบจริง',`<div class="form"><div class="field"><label>วันเริ่มรอบ</label><input id="editPerStart" type="date" value="${normalizeStoredDate(x.start_date)}"></div><div class="field"><label>วันหมดรอบ</label><input id="editPerEnd" type="date" value="${x.end_date?normalizeStoredDate(x.end_date):''}"></div><button class="btn" onclick="updatePeriod('${id}')">บันทึกการแก้ไข</button><button class="btn ghost" onclick="deletePeriod('${id}')">ลบรอบนี้</button></div>`)};
window.updatePeriod=async id=>{const x=(S.cyclePeriods||[]).find(y=>y.id===id),start=el('editPerStart')?.value,end=el('editPerEnd')?.value||null;if(!x)return;if(!start)return toast('เลือกวันเริ่มรอบก่อนนะ',true);if(start>isoToday()||(end&&end<start))return toast('วันที่รอบไม่ถูกต้อง',true);try{const d=await api('/rest/v1/menstrual_periods?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({start_date:start,end_date:end,updated_at:new Date().toISOString()})});const row=d?.[0];if(row){S.cyclePeriods=(S.cyclePeriods||[]).map(y=>y.id===id?row:y);S.cyclePeriods.sort((a,b)=>String(b.start_date||'').localeCompare(String(a.start_date||'')));await saveCycleSettingsData(start)}closeModal();render();toast('แก้ไขรอบแล้ว ✏️')}catch(e){toast('แก้ไขไม่ได้: '+e.message,true)}};
window.deletePeriod=async id=>{if(!confirm('ลบรอบนี้ใช่ไหม?'))return;try{await api('/rest/v1/menstrual_periods?id=eq.'+encodeURIComponent(id),{method:'DELETE'});S.cyclePeriods=(S.cyclePeriods||[]).filter(y=>y.id!==id);closeModal();render();toast('ลบรอบแล้ว')}catch(e){toast('ลบไม่ได้: '+e.message,true)}};
async function saveCycleSettingsData(start){const len=Number(el('cyLen')?.value||cycleFor(S.user.id)?.cycle_length||28);const periodLen=Number(el('cyPeriodLen')?.value||cycleFor(S.user.id)?.period_length||5);const actualStart=start||latestPeriod(S.user.id)?.start_date||cycleFor(S.user.id)?.last_period_start;if(len<21||len>45)throw new Error('รอบเดือนควรอยู่ระหว่าง 21–45 วัน');if(periodLen<2||periodLen>10)throw new Error('จำนวนวันประจำเดือนควรอยู่ระหว่าง 2–10 วัน');const body={user_id:S.user.id,couple_id:S.couple.id,last_period_start:actualStart,cycle_length:len,period_length:periodLen,is_active:true,updated_at:new Date().toISOString()};const d=await api('/rest/v1/menstrual_cycles?on_conflict=couple_id,user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});const row=d?.[0]||body;S.cycleData=(S.cycleData||[]).filter(x=>x.user_id!==S.user.id);S.cycleData.push(row);return row}
window.saveCycleSettings=async uid=>{if(uid!==S.user?.id)return toast('ให้เจ้าของบัญชีคนนั้นเป็นคนบันทึกข้อมูลของตัวเองนะ 🌸',true);try{await saveCycleSettingsData();closeModal();render();toast('บันทึกค่ารอบเฉลี่ยแล้ว 🌸')}catch(e){toast('บันทึกไม่ได้: '+e.message,true)}};
function cycles(){const people=[S.user?.id,S.partner?.id].filter(Boolean);return `<section class="page active"><div class="pagehead"><button class="back" onclick="go('home')">←</button><h2>ประจำเดือนของเรา 🌸</h2></div><div class="cycle-banner"><b>🌙 เราช่วยจำรอบให้</b><div class="cycle-note">บันทึกวันแรกของรอบจริงย้อนหลังได้ กด “มาวันนี้” และ “หมดวันนี้” ได้ แล้วระบบจะคาดการณ์รอบถัดไปให้</div></div>${people.map(uid=>{const c=cycleFor(uid),latest=latestPeriod(uid),p=cyclePrediction(c,latest),cur=currentPeriodInfo(uid),list=periodsFor(uid);return `<div class="section cycle-page-card"><div class="cycle-user-head"><div class="cycle-avatar" ${cycleAvatar(uid)}>${cycleAvatar(uid)?'':'🌸'}</div><div style="flex:1"><b>${esc(cycleName(uid))}</b><div class="tiny muted">${c?`รอบเฉลี่ย ${c.cycle_length} วัน · ประจำเดือน ${c.period_length} วัน`:'ยังไม่ได้ตั้งค่ารอบเฉลี่ย'}</div></div><button class="pill" onclick="openCycleEdit('${uid}')">✏️ ${uid===S.user?.id?'จัดการ':'ดูข้อมูล'}</button></div>${cur?.current?`<div class="card small" style="margin-top:12px"><div style="font-size:23px">🩸</div><h4>กำลังมีประจำเดือน</h4><p style="font-weight:800;color:#9b5c83;font-size:17px">วันที่ ${cur.days}</p><p>${latest.end_date?`หมดวันที่ ${displayThaiDate(latest.end_date)}`:'ยังไม่ระบุวันหมด'}</p></div>`:''}${p&&!cur?.current?`<div class="grid" style="margin-top:12px"><div class="card small"><div style="font-size:23px">🩷</div><h4>รอบถัดไป</h4><p style="font-weight:800;color:#9b5c83;font-size:17px">${displayThaiDate(p.next)}</p><p>${esc(cycleStatus(uid))}</p></div><div class="card small"><div style="font-size:23px">🌿</div><h4>ช่วงเจริญพันธุ์โดยประมาณ</h4><p style="font-weight:800;color:#5e806c">${displayThaiDate(p.fertileStart)} – ${displayThaiDate(p.fertileEnd)}</p><p>ไข่ตกโดยประมาณ ${displayThaiDate(p.ov)}</p></div></div><div class="cycle-calendar">${cycleMonthGrid(p)}</div><div class="cycle-legend"><span><i></i>ช่วงประจำเดือน</span><span><i class="f"></i>ช่วงเจริญพันธุ์โดยประมาณ</span><span>วงน้ำเงิน = วันนี้</span></div>`:''}<div class="section card small"><b>ประวัติรอบจริง</b>${list.length?list.slice(0,6).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">🩸 ${periodStatusText(x)}</div>`).join(''):'<p class="muted">ยังไม่มีประวัติ</p>'}</div><div class="cycle-note" style="margin-top:9px">การคาดการณ์เป็นเพียงการประมาณจากข้อมูลที่บันทึก ไม่ใช่การวินิจฉัยหรือยืนยันวันตกไข่</div></div>`}).join('')}<div class="section card"><b>🔒 ข้อมูลของเรา</b><div class="cycle-note" style="margin-top:5px">ข้อมูลรอบจริงของแต่ละคนเก็บแยกตามบัญชี และจะแสดงให้สมาชิกใน Couple เดียวกันเห็น</div></div></section>`}

function more(){return `<section class="page active"><div class="pagehead"><button class="back" onclick="go('home')">←</button><h2>More</h2></div><div class="card"><h3>👤 ชื่อของฉัน</h3><p class="tiny muted">ชื่อนี้จะแสดงบน Bubble ใน Chat และหัวแจ้งเตือนข้อความ</p><div class="form"><div class="field"><label>ชื่อของฉัน</label><input id="profileName" value="${esc(S.profile?.name||"")}" placeholder="เช่น Naphat"></div><button class="btn" onclick="saveProfileName()">บันทึกชื่อ</button></div></div><div class="card"><h3>ตั้งค่าพื้นที่</h3><div class="form"><div class="field"><label>ชื่อคู่รัก</label><input id="mn" value="${esc(S.couple?.couple_name||"")}"></div><div class="field"><label>ข้อความหน้าหลัก</label><input id="mm" value="${esc(S.couple?.home_message||"")}"></div><button class="btn" onclick="saveMore()">บันทึก</button></div></div><div class="section card"><div class="row"><div><b>🌸 ประจำเดือนของเรา</b><div class="tiny muted">คาดการณ์รอบของเราสองคนจากข้อมูลที่บันทึกไว้</div></div><button class="pill" onclick="go('cycles')">เปิด</button></div></div><div class="section card"><div class="row">
<div><b>🐾 โหมดเลี้ยงสัตว์</b><div class="tiny muted">เปิดก่อน จึงจะแสดงหน้าสัตว์เลี้ยงบน Home</div></div>
<button class="pill" style="min-width:84px" onclick="togglePetMode()">${S.couple?.show_pets?"🐾 เปิดอยู่":"ปิดอยู่"}</button>
</div></div><div class="section card"><div class="row"><div><b>🏃‍♀️ โหมดออกกำลังกาย</b><div class="tiny muted">เปิดเมื่ออยากติดตามว่าแต่ละวันได้ออกกำลังกายไหม</div></div><button class="pill" style="min-width:84px" onclick="toggleExerciseMode()">${S.couple?.show_exercise?"🏃 เปิดอยู่":"ปิดอยู่"}</button></div></div><div class="section card"><div class="row"><div><b>📨 รหัสเชิญแฟน</b><div class="tiny muted">ส่งรหัสนี้ให้แฟน</div></div><button class="pill" onclick="copyInvite()">คัดลอก</button></div><div style="text-align:center;font-size:22px;font-weight:800;letter-spacing:2px;margin-top:8px">${esc(S.couple?.invite_code||"ยังไม่มี")}</div></div><div class="section card"><b>เข้าร่วมพื้นที่ของแฟน</b><div class="form" style="margin-top:10px"><div class="field"><label>Invite Code</label><input id="jc"></div><button class="btn" onclick="joinCouple()">เข้าร่วม</button></div></div>${S.couple?.show_pets?`<div class="section card"><div class="row"><div><b>🐾 สัตว์เลี้ยงของเรา</b><div class="tiny muted">จัดการข้อมูลน้อง ๆ และคอร์สฝากเลี้ยง</div></div><button class="pill" onclick="go('petsPage')">จัดการ</button></div><button class="btn ghost" style="margin-top:10px" onclick="openPet()">＋ เพิ่มสัตว์เลี้ยง</button></div>`:""}<div class="section card"><b>🔔 การแจ้งเตือน</b><p class="tiny muted">ขอสิทธิ์แจ้งเตือนบนอุปกรณ์นี้</p><button class="btn ghost" onclick="requestNotifications()">เปิดการแจ้งเตือน + ทดสอบ 🔔</button></div><div class="section card"><button class="btn ghost" onclick="signOut()">ออกจากระบบ</button></div></section>`}
function render(){const f={home,reminders,memories,days,chat,pets,petsPage,more,cycles};el("root").innerHTML=shell((f[S.page]||home)());if(S.page==="chat"){setTimeout(()=>{const b=document.querySelector(".chatbox");if(b)b.scrollTop=b.scrollHeight;const i=el("chatText");if(i)i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}}},0)}}
function changePhoto(slot){el(slot==="cover"?"coverFile":slot==="me"?"meFile":slot==="partner"?"partnerFile":"petFile").click()}
async function uploadPhoto(slot,input){
 const file=input.files?.[0];if(!file)return;
 if(!S.user)return toast("กรุณาเข้าสู่ระบบก่อน");
 if(!S.couple)return toast("สร้าง Couple ก่อน");
 try{
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${S.user.id}/${slot}-${Date.now()}.${ext}`;
  const r=await fetch(URL_+`/storage/v1/object/${BUCKET}/${path}`,{
    method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+S.user.access_token,"Content-Type":file.type||"image/jpeg","x-upsert":"true"},

  const rows=logs.length?logs.map(x=>`<div class="card small row" style="margin:6px 0"><div><b>📅 ${usageDateDisplay(x.use_date)}</b>${x.note?`<div class="tiny muted">${esc(x.note)}</div>`:""}</div><div style="display:flex;gap:6px"><button class="pill" onclick="editUsage('${x.id}')">แก้</button><button class="pill" onclick="deleteUsage('${x.id}')">ลบ</button></div></div>`).join(""):`<div class="empty">ยังไม่ได้ลงวันที่ใช้งานย้อนหลัง</div>`;
  openModal("จัดการคอร์สฝาก",`<div class="form">
   <div class="notice"><b>🐾 ${esc(pet?.name||"")}</b><br>${esc(sv.service_name||"คอร์สฝาก")} · ${serviceUsed(sv)}/${Number(sv.total_days)} วัน · เหลือ ${serviceRemaining(sv)} วัน<br><span class="tiny muted">${displayThaiDate(sv.start_date)} → ${displayThaiDate(sv.end_date)}</span></div>
   <div class="field"><label>วันที่ใช้บริการย้อนหลัง</label><input id="ud" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
   <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input id="un" placeholder="เช่น ฝากเต็มวัน"></div>
   <button class="btn" onclick="addUsage('${serviceId}')">＋ เพิ่มวันที่ใช้</button>
   <div style="margin-top:8px"><b>ประวัติการใช้</b>${rows}</div>
  </div>`);
 }catch(e){toast(e.message,true)}
};

async function syncServiceUsed(serviceId){
 const logs=(S.petUsage&&S.petUsage[serviceId])||[];
 const used=logs.length;
 const up=await api("/rest/v1/pet_services?id=eq."+serviceId,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({used_days:used})});
 if(up[0])Object.keys(S.petServices||{}).forEach(k=>S.petServices[k]=S.petServices[k].map(x=>x.id===serviceId?up[0]:x));
 return used;
}

window.addUsage=async serviceId=>{
 try{
  const date=inputToStoredDate(el("ud").value);
  if(!date)return toast("เลือกวันที่ก่อน",true);
  const logs=(S.petUsage&&S.petUsage[serviceId])||[];
  if(logs.some(x=>normalizeStoredDate(x.use_date)===normalizeStoredDate(date)))return toast("มีวันที่นี้อยู่แล้ว",true);
  const d=await api("/rest/v1/pet_service_usage",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({pet_service_id:serviceId,couple_id:S.couple.id,use_date:date,note:el("un").value.trim()||null,created_by:S.user.id})});
  S.petUsage[serviceId]=[...(S.petUsage[serviceId]||[]),d[0]].sort((a,b)=>String(a.use_date).localeCompare(String(b.use_date)));
  const used=await syncServiceUsed(serviceId);
  closeModal();render();toast(`ลงย้อนหลังแล้ว • ใช้ไป ${used} วัน 📅`);
 }catch(e){toast("ลงย้อนหลังไม่ได้: "+e.message,true)}
};

window.editUsage=async usageId=>{
 const serviceId=Object.keys(S.petUsage||{}).find(k=>(S.petUsage[k]||[]).some(x=>x.id===usageId));
 const row=serviceId?(S.petUsage[serviceId]||[]).find(x=>x.id===usageId):null;
 if(!row)return toast("ไม่พบรายการ",true);
 openModal("แก้ไขวันที่ใช้",`<div class="form"><div class="field"><label>วันที่ใช้บริการ</label><input id="eud" type="date" value="${normalizeStoredDate(row.use_date)}"></div><div class="field"><label>หมายเหตุ</label><input id="eun" value="${esc(row.note||"")}"></div><button class="btn" onclick="saveUsage('${usageId}')">บันทึกการแก้ไข</button></div>`);
};
window.saveUsage=async usageId=>{
 try{
  const serviceId=Object.keys(S.petUsage||{}).find(k=>(S.petUsage[k]||[]).some(x=>x.id===usageId));
  if(!serviceId)return toast("ไม่พบรายการ",true);
  const date=inputToStoredDate(el("eud").value); if(!date)return toast("เลือกวันที่ก่อน",true);
  const dup=(S.petUsage[serviceId]||[]).some(x=>x.id!==usageId&&normalizeStoredDate(x.use_date)===normalizeStoredDate(date)); if(dup)return toast("มีวันที่นี้อยู่แล้ว",true);
  const up=await api("/rest/v1/pet_service_usage?id=eq."+usageId,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({use_date:date,note:el("eun").value.trim()||null})});
  S.petUsage[serviceId]=S.petUsage[serviceId].map(x=>x.id===usageId?up[0]:x).sort((a,b)=>String(a.use_date).localeCompare(String(b.use_date)));
  await syncServiceUsed(serviceId); closeModal(); render(); toast("แก้ไขวันที่แล้ว ✨");
 }catch(e){toast("แก้ไขไม่ได้: "+e.message,true)}
};
window.deleteUsage=async usageId=>{
 const serviceId=Object.keys(S.petUsage||{}).find(k=>(S.petUsage[k]||[]).some(x=>x.id===usageId));
 if(!serviceId)return toast("ไม่พบรายการ",true);
 const row=S.petUsage[serviceId].find(x=>x.id===usageId);
 if(!confirm(`ลบวันที่ ${usageDateDisplay(row?.use_date)||"นี้"} ออกจากประวัติการใช้ไหม?`))return;
 try{
  await api("/rest/v1/pet_service_usage?id=eq."+usageId,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
  S.petUsage[serviceId]=S.petUsage[serviceId].filter(x=>x.id!==usageId); await syncServiceUsed(serviceId); closeModal(); render(); toast("ลบวันที่แล้ว");
 }catch(e){toast("ลบไม่ได้: "+e.message,true)}
};

window.pauseService=async serviceId=>{
 openModal("เลื่อน/หยุดคอร์ส",`<div class="form">
 <div class="field"><label>หยุดกี่วัน</label><input id="pd" type="number" min="1" value="1"></div>
 <div class="notice">ระบบจะเลื่อนวันหมดอายุออกตามจำนวนวันที่หยุด</div>
 <button class="btn" onclick="savePause('${serviceId}')">บันทึก</button></div>`);
};

window.savePause=async serviceId=>{
 try{
  const days=Math.max(1,Number(el("pd").value)||1);
  const sv=Object.values(S.petServices).flat().find(x=>x.id===serviceId);
  if(!sv)return toast("ไม่พบคอร์ส",true);
  const oldEnd=new Date(normalizeStoredDate(sv.end_date)+"T00:00:00");
  oldEnd.setDate(oldEnd.getDate()+days);
  const up=await api("/rest/v1/pet_services?id=eq."+serviceId,{
    method:"PATCH",headers:{"Prefer":"return=representation"},
    body:JSON.stringify({end_date:oldEnd.toISOString().slice(0,10)})
  });
  try{
    await api("/rest/v1/pet_service_pauses_v2",{
      method:"POST",headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({pet_service_id:serviceId,paused_days:days,reason:"หยุด/เลื่อนคอร์ส"})
    });
  }catch{}
  Object.keys(S.petServices).forEach(k=>S.petServices[k]=S.petServices[k].map(x=>x.id===serviceId?up[0]:x));
  closeModal();render();toast(`เลื่อนวันหมดอายุ +${days} วัน ⏸️`);
}catch(e){toast(e.message,true)}
};

window.renewService=async petId=>{openService(petId)};
window.cancelService=async serviceId=>{
 if(!confirm("ยกเลิกคอร์สนี้ใช่ไหม?"))return;
 try{
  const up=await api("/rest/v1/pet_services?id=eq."+serviceId,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({status:"cancelled"})});
  Object.keys(S.petServices).forEach(k=>S.petServices[k]=S.petServices[k].filter(x=>x.id!==serviceId).concat(up));
  render();toast("ยกเลิกคอร์สแล้ว");
 }catch(e){toast(e.message,true)}
};
window.sendMessage=async()=>{try{const input=el("chatText"),text=input.value.trim();if(!text)return;input.disabled=true;const d=await api("/rest/v1/messages",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({couple_id:S.couple.id,sender_id:S.user.id,content:text})});S.messages.push(d[0]);render();await callPushFunction({type:"message",couple_id:S.couple.id,message_id:d[0].id,sender_id:S.user.id,sender_name:S.profile?.name||S.profile?.display_name||S.profile?.full_name||S.user?.user_metadata?.name||S.user?.email?.split("@")[0]||"คนรัก",content:text});setTimeout(()=>{const b=document.querySelector(".chatbox");if(b)b.scrollTop=b.scrollHeight;const i=el("chatText");if(i){i.focus();}},30);}catch(e){toast(e.message,true)}finally{const i=el("chatText");if(i)i.disabled=false}};
window.togglePetMode=async()=>{try{
const next=!Boolean(S.couple?.show_pets);
const d=await api("/rest/v1/couples?id=eq."+S.couple.id,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({show_pets:next})});
S.couple=d[0];render();toast(next?"เปิดโหมดเลี้ยงสัตว์แล้ว 🐾":"ปิดโหมดเลี้ยงสัตว์แล้ว");
}catch(e){toast(e.message,true)}};
window.saveProfileName=async()=>{try{const name=el("profileName")?.value.trim();if(!name)return toast("ใส่ชื่อก่อน",true);await saveMyName(name);render();toast("บันทึกชื่อแล้ว ✨")}catch(e){toast("บันทึกชื่อไม่สำเร็จ: "+(e?.message||e),true)}};
window.saveMore=async()=>{try{const d=await api("/rest/v1/couples?id=eq."+S.couple.id,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({couple_name:el("mn").value.trim(),home_message:el("mm").value})});S.couple=d[0];render();toast("บันทึกแล้ว ✨")}catch(e){toast(e.message,true)}};
window.copyInvite=async()=>{try{await navigator.clipboard.writeText(S.couple.invite_code);toast("คัดลอกรหัสแล้ว 📋")}catch{toast(S.couple.invite_code)}};
async function joinByCode(code){
 code=(code||"").trim().toUpperCase();
 if(!code)return toast("ใส่ Invite Code ก่อน",true);
 const a=await api("/rest/v1/couples?invite_code=eq."+encodeURIComponent(code)+"&select=id,couple_name");
 if(!a.length)throw new Error("ไม่พบรหัสนี้");
 const target=a[0].id;
 const memberships=await api("/rest/v1/couple_members?user_id=eq."+encodeURIComponent(S.user.id)+"&select=couple_id");
 if(memberships.some(x=>x.couple_id===target)){saveActiveCouple(target);await load(target);go("home");return}
 await api("/rest/v1/couple_members",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({couple_id:target,user_id:S.user.id,role:"member"})});
 saveActiveCouple(target);
 await load(target);
 go("home");
 toast("เข้าร่วมพื้นที่ของแฟนแล้ว 💙");
}
window.joinCouple=async()=>{try{await joinByCode(el("jc")?.value)}catch(e){toast(e.message,true)}};
window.joinFromSetup=async()=>{try{const name=el("joinMyName")?.value.trim();if(!name)return toast("ใส่ชื่อของฉันก่อน",true);await saveMyName(name);await joinByCode(el("setupJoinCode")?.value)}catch(e){toast(e.message,true)}};
window.requestNotifications=async()=>{
 if(!("Notification"in window))return toast("เบราว์เซอร์นี้ไม่รองรับแจ้งเตือน",true);
 try{
   const p=await Notification.requestPermission();
   if(p!=="granted")return toast(p==="denied"?"การแจ้งเตือนถูกปฏิเสธ — ไปเปิดที่ Settings ของ iPhone ได้":"ยังไม่ได้อนุญาต",true);
   await registerPushSubscription();
   toast("เปิด Push Notification แล้ว 🔔");
   await showBMNotification("💙 BlueMoon Days","ทดสอบแจ้งเตือนบนเครื่องนี้แล้ว","bm-test");
   const r=await callPushFunction({type:"test",couple_id:S.couple.id});
   if(r?.ok)toast(`ส่งทดสอบ Push จากเซิร์ฟเวอร์แล้ว 🚀 (${r.sent||0} เครื่อง)`);
   else if(r?.error)toast("สมัคร Push แล้ว แต่เซิร์ฟเวอร์ทดสอบไม่สำเร็จ: "+r.error,true);
 }catch(e){toast("เปิดแจ้งเตือนไม่สำเร็จ: "+(e?.message||e),true)}
};async function showBMNotification(title,body,tag){if(!("Notification" in window)||Notification.permission!=="granted")return;try{const reg=await navigator.serviceWorker?.ready;if(reg?.showNotification){await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'bluemoon'});return}}catch{}try{new Notification(title,{body,icon:'icon-192.png',tag:tag||'bluemoon'})}catch{}}function reminderKey(r){return 'bm_notified_'+r.id+'_'+normalizeStoredDate(r.reminder_date)+'_'+String(r.reminder_time||'').slice(0,5)}async function checkReminders(){if(!S.user||!S.couple||!S.reminders?.length)return;const now=new Date();for(const r of S.reminders){if(!r.is_active||r.is_completed||!r.reminder_date)continue;const g=normalizeStoredDate(r.reminder_date),tm=(r.reminder_time||'09:00').slice(0,5),due=new Date(g+'T'+tm+':00');if(Number.isNaN(due.getTime()))continue;if(now>=due&&now-due<36*60*60*1000){const k=reminderKey(r);if(!localStorage.getItem(k)){await showBMNotification('⏰ '+r.title,'ถึงเวลาแล้ว 💙',k);localStorage.setItem(k,'1')}}}};
window.signOut=async()=>{clearSession();if(S.user?.id)localStorage.removeItem(coupleStorageKey(S.user.id));location.reload()};
let lastChatIds=[];
async function refreshChat(silent=false){
 if(!S.user||!S.couple)return;
 try{
  const a=await api("/rest/v1/messages?couple_id=eq."+S.couple.id+"&select=*&order=created_at.asc");
  const old=JSON.stringify(S.messages.map(x=>x.id)); const neu=JSON.stringify(a.map(x=>x.id));
  if(old!==neu){
   const had=S.messages.length>0, incoming=a.filter(x=>x.sender_id!==S.user.id&& !S.messages.some(y=>y.id===x.id));
   S.messages=a;
   if(S.page==="chat") render();
   if(incoming.length&&document.hidden) showBMNotification('💙 BlueMoon Days',incoming[incoming.length-1].content,'chat-'+incoming[incoming.length-1].id);
  }
 }catch(e){if(!silent)toast(e.message,true)}
}

setInterval(()=>checkReminders(),15000);
setTimeout(()=>checkReminders(),2500);

// Keep Chat fresh when a phone/browser wakes up from a push notification.
let __bmRefreshTimer=null;
function refreshChatOnResume(){
  if(!S.user||!S.couple||document.hidden)return;
  clearTimeout(__bmRefreshTimer);
  __bmRefreshTimer=setTimeout(async()=>{
    if(S.page!=="chat")return;
    await refreshChat(true);
    // Reconnect Realtime after mobile browsers suspend the WebSocket in background.
    if(!window.__bmRealtime)startRealtime();
  },250);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshChatOnResume()});
window.addEventListener("focus",refreshChatOnResume);
window.addEventListener("pageshow",refreshChatOnResume);
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message",ev=>{
    if(ev.data?.type==="open-chat"){
      go("chat");
      refreshChat(true);
    }
  });
}
setInterval(()=>{if(S.page==="chat"&&!document.hidden)refreshChat(true)},5000);

boot();
</script>
